
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff6900">
<title>VAYO — Воридшавӣ ва сабти ном</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --orange:#ff6900;
  --orange2:#ff8c32;
  --dark:#20232a;
  --muted:#7b828e;
  --border:#e8eaf0;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  background:linear-gradient(145deg,#fff8f2,#f5f6fa 65%);
  color:var(--dark);
  font-family:Inter,"Noto Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input { font:inherit; }
button { cursor:pointer; }
header {
  background:#fff;
  padding:15px 6%;
  border-bottom:1px solid var(--border);
}
.logo {
  color:var(--orange);
  font-size:31px;
  font-weight:900;
  letter-spacing:-1.4px;
  text-decoration:none;
}
main {
  min-height:calc(100vh - 75px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 15px;
}
.card {
  background:#fff;
  width:100%;
  max-width:440px;
  padding:35px;
  border-radius:24px;
  box-shadow:0 18px 60px #20232a12;
}
.icon {
  margin:0 auto 18px;
  width:64px;
  height:64px;
  display:grid;
  place-items:center;
  border-radius:19px;
  background:linear-gradient(135deg,var(--orange),var(--orange2));
  color:#fff;
  font-size:31px;
  font-weight:900;
}
h1 {
  text-align:center;
  margin:0 0 9px;
  font-size:27px;
  font-weight:900;
  letter-spacing:-.5px;
}
.subtitle {
  color:var(--muted);
  text-align:center;
  font-size:14px;
  line-height:1.8;
  margin:0 0 25px;
}
.tabs {
  display:flex;
  gap:6px;
  background:#f4f5f7;
  border-radius:13px;
  padding:5px;
  margin-bottom:23px;
}
.tab {
  flex:1;
  padding:12px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  font-size:14px;
  font-weight:800;
}
.tab.active {
  background:#fff;
  color:var(--orange);
  box-shadow:0 2px 10px #0000000d;
}
.field { margin-bottom:18px; }
label {
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:8px;
}
input {
  width:100%;
  padding:15px 16px;
  border:1.5px solid var(--border);
  border-radius:12px;
  outline:none;
  font-size:14px;
  color:var(--dark);
}
input:focus {
  border-color:var(--orange);
  box-shadow:0 0 0 4px #ff690016;
}
.passwordbox { position:relative; }
.passwordbox input { padding-right:75px; }
.showpass {
  position:absolute;
  right:9px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:var(--orange);
  font-size:12px;
  font-weight:800;
}
.forgot {
  text-align:right;
  margin:-4px 0 20px;
}
.linkbtn {
  background:none;
  border:0;
  color:var(--orange);
  font-size:13px;
  font-weight:800;
}
.primary {
  width:100%;
  padding:16px;
  background:linear-gradient(110deg,var(--orange),var(--orange2));
  border:0;
  border-radius:12px;
  color:#fff;
  font-size:15px;
  font-weight:900;
}
.primary:disabled { opacity:.6; }
.message {
  display:none;
  padding:13px;
  margin-bottom:18px;
  border-radius:11px;
  font-size:13px;
  line-height:1.7;
  overflow-wrap:anywhere;
}
.message.success {
  display:block;
  background:#eaf8ef;
  color:#166534;
}
.message.error {
  display:block;
  background:#fff0ee;
  color:#b42318;
}
.bottom {
  text-align:center;
  color:var(--muted);
  font-size:12px;
  line-height:1.9;
  margin:23px 0 0;
}
.bottom strong { color:var(--orange); }
.hidden { display:none!important; }
@media(max-width:480px) {
  main { align-items:flex-start;padding:23px 12px; }
  .card { padding:27px 20px; }
  h1 { font-size:24px; }
}
</style>
</head>

<body>
<header>
  <a href="./index.html" class="logo">VAYO</a>
</header>

<main>
<section class="card">
  <div class="icon">V</div>

  <h1 id="heading">Хуш омадед!</h1>
  <p class="subtitle" id="subtitle">
    Ба ҳисоби VAYO ворид шавед.
  </p>

  <div class="tabs" id="tabs">
    <button class="tab active" id="loginTab" type="button">
      Воридшавӣ
    </button>
    <button class="tab" id="registerTab" type="button">
      Сабти ном
    </button>
  </div>

  <div id="message" class="message" role="status" aria-live="polite"></div>

  <form id="authForm">
    <div class="field" id="emailField">
      <label for="email">Почтаи электронӣ</label>
      <input
        id="email"
        type="email"
        placeholder="example@gmail.com"
        autocomplete="email"
        required
      >
    </div>

    <div class="field" id="passwordField">
      <label for="password" id="passwordLabel">Парол</label>
      <div class="passwordbox">
        <input
          id="password"
          type="password"
          placeholder="Пароли худро ворид кунед"
          autocomplete="current-password"
          minlength="6"
          required
        >
        <button type="button" class="showpass" id="showPass">
          Намоиш
        </button>
      </div>
    </div>

    <div class="forgot" id="forgotBox">
      <button type="button" class="linkbtn" id="forgotBtn">
        Паролро фаромӯш кардед?
      </button>
    </div>

    <button class="primary" type="submit" id="submitBtn">
      Ворид шудан
    </button>
  </form>

  <div style="text-align:center;margin-top:20px">
    <button class="linkbtn hidden" id="backBtn" type="button">
      Бозгашт ба воридшавӣ
    </button>
  </div>

  <p class="bottom">
    Хариди осон, нархҳои беҳтарин.
    <br>
    <strong>VAYO — Ҷаҳони харид дар дасти шумо</strong>
  </p>
</section>
</main>

<script>
"use strict";

const SUPABASE_URL =
  "https://rgminzzmlktkliliiupt.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_UHJzsYIpimmjtDtHEnacQA_BJVKE2pD";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const LOGIN_URL = new URL("./login.html",location.href).href;
const HOME_URL = new URL("./index.html",location.href).href;
const $ = id => document.getElementById(id);

let mode = "login";
let busy = false;

function message(text,type="error"){
  $("message").textContent=text;
  $("message").className="message "+type;
}

function clearMessage(){
  $("message").textContent="";
  $("message").className="message";
}

function label(){
  return mode==="register"?"Ҳисоб сохтан":
         mode==="reset"?"Фиристодани пайванд":
         mode==="update"?"Нигоҳ доштани парол":
         "Ворид шудан";
}

function setMode(next){
  mode=next;
  clearMessage();

  $("tabs").classList.toggle("hidden",mode==="reset"||mode==="update");
  $("loginTab").classList.toggle("active",mode==="login");
  $("registerTab").classList.toggle("active",mode==="register");
  $("forgotBox").classList.toggle("hidden",mode!=="login");
  $("backBtn").classList.toggle("hidden",mode!=="reset"&&mode!=="update");
  $("passwordField").classList.toggle("hidden",mode==="reset");
  $("emailField").classList.toggle("hidden",mode==="update");

  $("password").required=mode!=="reset";
  $("email").required=mode!=="update";
  $("password").autocomplete=mode==="login"?"current-password":"new-password";
  $("passwordLabel").textContent=mode==="update"?"Пароли нав":"Парол";

  $("heading").textContent=
    mode==="login"?"Хуш омадед!":
    mode==="register"?"Ба VAYO ҳамроҳ шавед":
    mode==="reset"?"Паролро барқарор кунед":
    "Пароли нав гузоред";

  $("subtitle").textContent=
    mode==="login"?"Ба ҳисоби худ ворид шавед ва харидро оғоз кунед.":
    mode==="register"?"Ҳисоби ройгон созед ва харид кунед.":
    mode==="reset"?"Email-и худро ворид кунед, то пайванди барқароркунӣ фиристем.":
    "Пароли нави худро ворид кунед.";

  $("submitBtn").textContent=label();
}

async function submitAuth(event){
  event.preventDefault();
  if(busy)return;

  busy=true;
  $("submitBtn").disabled=true;
  $("submitBtn").textContent="Интизор шавед...";
  clearMessage();

  try {
    const email=$("email").value.trim();
    const password=$("password").value;

    if(mode==="login"){
      const {error}=await db.auth.signInWithPassword({
        email,password
      });
      if(error)throw error;
      location.assign(HOME_URL);
      return;
    }

    if(mode==="register"){
      const {data,error}=await db.auth.signUp({
        email,password,
        options:{emailRedirectTo:LOGIN_URL}
      });
      if(error)throw error;

      if(data.session){
        location.assign(HOME_URL);
        return;
      }

      message(
        "Сабти ном қабул шуд. Email-и худро кушоед ва ҳисоби худро тасдиқ кунед.",
        "success"
      );
      return;
    }

    if(mode==="reset"){
      const {error}=await db.auth.resetPasswordForEmail(
        email,{redirectTo:LOGIN_URL}
      );
      if(error)throw error;
      message(
        "Агар ин email сабт шуда бошад, пайванди барқароркунӣ фиристода мешавад.",
        "success"
      );
      return;
    }

    if(mode==="update"){
      const {error}=await db.auth.updateUser({password});
      if(error)throw error;
      await db.auth.signOut();
      setMode("login");
      message("Парол нав шуд. Акнун ворид шавед.","success");
    }

  } catch(error){
    message(error.message||"Хатогӣ рух дод.");
  } finally {
    busy=false;
    $("submitBtn").disabled=false;
    $("submitBtn").textContent=label();
  }
}

$("loginTab").onclick=()=>setMode("login");
$("registerTab").onclick=()=>setMode("register");
$("forgotBtn").onclick=()=>setMode("reset");
$("backBtn").onclick=()=>setMode("login");

$("showPass").onclick=()=>{
  const input=$("password");
  const visible=input.type==="password";
  input.type=visible?"text":"password";
  $("showPass").textContent=visible?"Пинҳон":"Намоиш";
};

$("authForm").addEventListener("submit",submitAuth);

async function initialize(){
  db.auth.onAuthStateChange(event=>{
    if(event==="PASSWORD_RECOVERY"){
      setMode("update");
    }
  });

  const params=new URLSearchParams(location.search);
  const hash=new URLSearchParams(location.hash.slice(1));

  if(params.get("type")==="recovery"||
     hash.get("type")==="recovery"){
    setMode("update");
  }

  if(params.get("error_description")||
     hash.get("error_description")){
    message(
      params.get("error_description")||
      hash.get("error_description")
    );
  }

  try {
    const {data}=await db.auth.getSession();
    if(data.session&&mode==="login"){
      message("Шумо аллакай ворид шудаед.","success");
    }
  } catch(e){
    message("Пайвастшавӣ ба Supabase муваффақ нашуд.");
  }
}

initialize();
</script>
</body>
</html>
