
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAYO — Воридшавӣ ва сабти ном</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --orange: #ff6900;
  --orange-dark: #e95600;
  --text: #202124;
  --muted: #737780;
  --border: #e8e9ed;
  --background: #f7f8fb;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--background);
  color: var(--text);
  font-family: 'Inter', 'Noto Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
}

header {
  background: white;
  padding: 17px 6%;
  border-bottom: 1px solid var(--border);
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--orange);
  text-decoration: none;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: -1.5px;
}

.logo-icon {
  display: grid;
  place-items: center;
  width: 43px;
  height: 43px;
  border-radius: 13px;
  color: white;
  background: var(--orange);
  font-size: 24px;
}

main {
  min-height: calc(100vh - 80px);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 32px 16px;
}

.auth-card {
  width: 100%;
  max-width: 440px;
  padding: 35px;
  background: white;
  border-radius: 24px;
  box-shadow: 0 15px 55px rgba(20,25,40,.07);
}

h1 {
  margin: 0 0 9px;
  font-size: 27px;
  font-weight: 900;
  letter-spacing: -.7px;
  line-height: 1.3;
}

.subtitle {
  margin: 0 0 25px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--muted);
}

.tabs {
  display: flex;
  gap: 8px;
  padding: 5px;
  margin-bottom: 25px;
  border-radius: 13px;
  background: #f4f5f7;
}

.tab {
  flex: 1;
  padding: 12px 8px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: #737780;
  font: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.tab.active {
  background: white;
  color: var(--orange);
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.field {
  margin-bottom: 18px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-size: 13px;
  font-weight: 700;
}

input {
  width: 100%;
  padding: 15px 16px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  outline: none;
  background: white;
  color: var(--text);
  font: inherit;
  font-size: 14px;
  transition: .2s;
}

input:focus {
  border-color: var(--orange);
  box-shadow: 0 0 0 3px rgba(255,105,0,.09);
}

input::placeholder { color: #a0a4ad; }

.primary-btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: var(--orange);
  color: white;
  font: inherit;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: .2s;
}

.primary-btn:hover { background: var(--orange-dark); }
.primary-btn:disabled { opacity: .55; cursor: wait; }

.links {
  display: flex;
  justify-content: flex-end;
  margin: -5px 0 20px;
}

.link-btn {
  border: none;
  background: none;
  color: var(--orange);
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.message {
  display: none;
  padding: 13px;
  margin-bottom: 17px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.message.success {
  display: block;
  background: #eaf8ee;
  color: #166534;
}

.message.error {
  display: block;
  background: #fff0ef;
  color: #b42318;
}

.footer-note {
  margin-top: 23px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
}

.footer-note strong { color: var(--orange); }

.hidden { display: none !important; }

@media(max-width:480px) {
  header { padding: 13px 20px; }
  main { align-items: flex-start; padding: 25px 12px; }
  .auth-card { padding: 26px 20px; border-radius: 19px; }
  h1 { font-size: 24px; }
}
</style>
</head>

<body>

<header>
  <a class="logo" href="./index.html">
    <span class="logo-icon">V</span>
    VAYO
  </a>
</header>

<main>
  <section class="auth-card">

    <h1 id="heading">Хуш омадед!</h1>
    <p class="subtitle" id="subtitle">
      Ба ҳисоби VAYO ворид шавед ва харидро оғоз кунед.
    </p>

    <div class="tabs" id="tabs">
      <button class="tab active" id="loginTab" type="button">
        Воридшавӣ
      </button>
      <button class="tab" id="registerTab" type="button">
        Сабти ном
      </button>
    </div>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <form id="authForm">

      <div class="field">
        <label for="email">Почтаи электронӣ</label>
        <input
          id="email"
          type="email"
          placeholder="example@gmail.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="password" id="passwordLabel">
          Парол
        </label>
        <input
          id="password"
          type="password"
          placeholder="Пароли худро ворид кунед"
          autocomplete="current-password"
          minlength="6"
          required
        >
      </div>

      <div class="links" id="forgotBox">
        <button class="link-btn" id="forgotBtn" type="button">
          Паролро фаромӯш кардед?
        </button>
      </div>

      <button class="primary-btn" id="submitBtn" type="submit">
        Ворид шудан
      </button>

    </form>

    <button
      class="link-btn hidden"
      id="backBtn"
      type="button"
      style="margin-top:20px;width:100%;text-align:center"
    >
      Бозгашт ба воридшавӣ
    </button>

    <p class="footer-note">
      Бо истифода аз VAYO шумо шартҳои хизматрасонии
      платформаро қабул мекунед.
      <br>
      <strong>VAYO — Ҷаҳони харид дар дасти шумо</strong>
    </p>

  </section>
</main>

<script>
"use strict";

// Танҳо Publishable / anon key истифода шавад.
const SUPABASE_URL =
  "https://rgminzzmlktkliliiupt.supabase.co";

// Калиди publishable-и лоиҳаи худро дар ин ҷо гузоред.
const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const LOGIN_URL = new URL("./login.html", location.href).href;
const SELLER_URL = new URL("./seller.html", location.href).href;
const HOME_URL = new URL("./index.html", location.href).href;

const $ = id => document.getElementById(id);

let mode = "login";
let busy = false;
let client = null;

function showMessage(text, type = "error") {
  const el = $("message");
  el.textContent = text;
  el.className = "message " + type;
}

function clearMessage() {
  $("message").textContent = "";
  $("message").className = "message";
}

function setBusy(value) {
  busy = value;
  $("submitBtn").disabled = value;
}

function setMode(nextMode) {
  mode = nextMode;
  clearMessage();

  const isLogin = mode === "login";
  const isRegister = mode === "register";
  const isReset = mode === "reset";
  const isUpdate = mode === "update";

  $("tabs").classList.toggle("hidden", isReset || isUpdate);
  $("loginTab").classList.toggle("active", isLogin);
  $("registerTab").classList.toggle("active", isRegister);

  $("forgotBox").classList.toggle("hidden", !isLogin);
  $("backBtn").classList.toggle("hidden", !(isReset || isUpdate));

  $("password").parentElement.classList.toggle("hidden", isReset);
  $("password").required = !isReset;

  $("passwordLabel").textContent =
    isUpdate ? "Пароли нав" : "Парол";

  $("password").autocomplete =
    isLogin ? "current-password" : "new-password";

  $("heading").textContent =
    isLogin ? "Хуш омадед!" :
    isRegister ? "Ҳисоб созед" :
    isReset ? "Барқароркунии парол" :
    "Пароли нав гузоред";

  $("subtitle").textContent =
    isLogin ? "Ба ҳисоби VAYO ворид шавед." :
    isRegister ? "Дар VAYO ройгон сабти ном кунед." :
    isReset ? "Ба email-и шумо пайванди барқароркунӣ мефиристем." :
    "Пароли нави ҳисоби худро ворид кунед.";

  $("submitBtn").textContent =
    isLogin ? "Ворид шудан" :
    isRegister ? "Сабти ном кардан" :
    isReset ? "Фиристодани пайванд" :
    "Нигоҳ доштани парол";
}

function getClient() {
  if (!client) {
    if (
      !SUPABASE_KEY ||
      SUPABASE_KEY.includes("PASTE_YOUR")
    ) {
      throw new Error(
        "Калиди Publishable дар login.html ҳанӯз гузошта нашудааст."
      );
    }

    client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
  }
  return client;
}

async function handleAuth(event) {
  event.preventDefault();
  if (busy) return;

  clearMessage();
  setBusy(true);

  try {
    const supabase = getClient();
    const email = $("email").value.trim();
    const password = $("password").value;

    if (mode === "register") {
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: LOGIN_URL
        }
      });

      if (error) throw error;

      if (data.session) {
        showMessage("Ҳисоб сохта шуд!", "success");
        setTimeout(() => {
          location.assign(SELLER_URL);
        }, 800);
      } else {
        showMessage(
          "Сабти ном қабул шуд. Email-и худро кушоед ва пайванди тасдиқро пахш кунед.",
          "success"
        );
      }

    } else if (mode === "login") {
      const { error } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });

      if (error) throw error;

      location.assign(SELLER_URL);

    } else if (mode === "reset") {
      const { error } =
        await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: LOGIN_URL
        });

      if (error) throw error;

      showMessage(
        "Агар ин email сабт шуда бошад, пайванди барқароркунии парол фиристода мешавад.",
        "success"
      );

    } else if (mode === "update") {
      const { error } =
        await supabase.auth.updateUser({
          password
        });

      if (error) throw error;

      showMessage("Парол нав карда шуд.", "success");
      setMode("login");
      showMessage(
        "Парол нав карда шуд. Акнун ворид шавед.",
        "success"
      );
    }

  } catch (error) {
    showMessage(error.message || "Хатогӣ рух дод.");
  } finally {
    setBusy(false);
  }
}

$("loginTab").addEventListener("click", () => setMode("login"));
$("registerTab").addEventListener("click", () => setMode("register"));
$("forgotBtn").addEventListener("click", () => setMode("reset"));
$("backBtn").addEventListener("click", () => setMode("login"));
$("authForm").addEventListener("submit", handleAuth);

async function initialize() {
  try {
    const supabase = getClient();

    supabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        setMode("update");
      }
    });

    const hash = new URLSearchParams(location.hash.slice(1));
    if (hash.get("type") === "recovery") {
      setMode("update");
    }

    const { data } = await supabase.auth.getSession();

    if (data.session && mode === "login") {
      showMessage(
        "Шумо аллакай ворид шудаед. Метавонед ба панели VAYO гузаред.",
        "success"
      );
    }
  } catch (error) {
    showMessage(error.message);
  }
}

initialize();
</script>

</body>
</html>
