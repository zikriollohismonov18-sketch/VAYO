
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff6900">
<title>VAYO | Воридшавӣ ва сабти ном</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --orange: #ff6900;
  --orange-dark: #e95c00;
  --text: #1e2229;
  --muted: #77808c;
  --line: #e9ebef;
  --bg: #f7f8fb;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", "Noto Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

header {
  background: #fff;
  border-bottom: 1px solid var(--line);
  padding: 16px 6%;
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  text-decoration: none;
  color: var(--orange);
  font-size: 30px;
  font-weight: 900;
  letter-spacing: -1.4px;
}

.logo-mark {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  background: var(--orange);
  color: #fff;
  border-radius: 13px;
  font-size: 25px;
}

main {
  min-height: calc(100vh - 80px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 15px;
}

.card {
  width: 100%;
  max-width: 445px;
  background: white;
  padding: 35px;
  border-radius: 24px;
  box-shadow: 0 16px 55px rgba(22,30,45,.075);
}

.welcome {
  text-align: center;
  margin-bottom: 25px;
}

.welcome h1 {
  margin: 0 0 9px;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -.6px;
  line-height: 1.3;
}

.welcome p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.8;
}

.tabs {
  display: flex;
  gap: 6px;
  background: #f4f5f7;
  padding: 5px;
  border-radius: 13px;
  margin-bottom: 24px;
}

.tab {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 12px 8px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 800;
}

.tab.active {
  color: var(--orange);
  background: white;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.field {
  margin-bottom: 19px;
}

.field label {
  display: block;
  font-size: 13px;
  font-weight: 800;
  margin-bottom: 9px;
}

.field input {
  width: 100%;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 15px 16px;
  background: white;
  color: var(--text);
  outline: none;
  font-size: 14px;
  transition: .2s;
}

.field input:focus {
  border-color: var(--orange);
  box-shadow: 0 0 0 4px rgba(255,105,0,.09);
}

.field input::placeholder {
  color: #a3aab4;
}

.password-wrap {
  position: relative;
}

.password-wrap input {
  padding-right: 65px;
}

.show-password {
  position: absolute;
  right: 11px;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: 0;
  color: var(--orange);
  font-size: 12px;
  font-weight: 800;
  padding: 7px;
}

.forgot-row {
  display: flex;
  justify-content: flex-end;
  margin: -5px 0 20px;
}

.text-button {
  background: none;
  border: 0;
  color: var(--orange);
  font-size: 13px;
  font-weight: 800;
}

.primary {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 16px;
  background: var(--orange);
  color: white;
  font-size: 15px;
  font-weight: 900;
  transition: .2s;
}

.primary:hover {
  background: var(--orange-dark);
}

.primary:disabled {
  opacity: .55;
  cursor: wait;
}

.message {
  display: none;
  padding: 14px;
  margin-bottom: 20px;
  border-radius: 11px;
  font-size: 13px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.message.success {
  display: block;
  color: #166534;
  background: #e9f8ed;
}

.message.error {
  display: block;
  color: #b42318;
  background: #fff0ee;
}

.note {
  margin: 24px 0 0;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.9;
}

.note strong {
  color: var(--orange);
}

.hidden {
  display: none !important;
}

@media (max-width: 480px) {
  header { padding: 13px 20px; }
  main { align-items: flex-start; padding: 25px 12px; }
  .card { padding: 26px 20px; border-radius: 20px; }
  .welcome h1 { font-size: 25px; }
}
</style>
</head>

<body>

<header>
  <a href="./index.html" class="logo">
    <span class="logo-mark">V</span>
    VAYO
  </a>
</header>

<main>
<section class="card">

  <div class="welcome">
    <h1 id="heading">Хуш омадед!</h1>
    <p id="subtitle">
      Ба ҳисоби худ ворид шавед ва харидро оғоз кунед.
    </p>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" id="loginTab" type="button">
      Воридшавӣ
    </button>
    <button class="tab" id="registerTab" type="button">
      Сабти ном
    </button>
  </div>

  <div class="message" id="message" role="status" aria-live="polite"></div>

  <form id="authForm">

    <div class="field">
      <label for="email">Почтаи электронӣ</label>
      <input
        id="email"
        type="email"
        placeholder="example@gmail.com"
        autocomplete="email"
        required
      >
    </div>

    <div class="field" id="passwordField">
      <label for="password" id="passwordLabel">Парол</label>

      <div class="password-wrap">
        <input
          id="password"
          type="password"
          placeholder="Пароли худро ворид кунед"
          autocomplete="current-password"
          minlength="6"
          required
        >
        <button
          type="button"
          class="show-password"
          id="showPassword"
        >
          Намоиш
        </button>
      </div>
    </div>

    <div class="forgot-row" id="forgotRow">
      <button type="button" class="text-button" id="forgotBtn">
        Паролро фаромӯш кардед?
      </button>
    </div>

    <button class="primary" id="submitBtn" type="submit">
      Ворид шудан
    </button>

  </form>

  <button
    type="button"
    class="text-button hidden"
    id="backBtn"
    style="display:block;margin:22px auto 0"
  >
    Бозгашт ба воридшавӣ
  </button>

  <p class="note">
    VAYO — Хариди осон, нархҳои беҳтарин.
    <br>
    <strong>Ҷаҳони харид дар дасти шумо</strong>
  </p>

</section>
</main>

<script>
"use strict";

/* ==============================
   VAYO SUPABASE CONFIGURATION
============================== */

const SUPABASE_URL =
  "https://rgminzzmlktkliliiupt.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_UHJzsYIpimmjtDtHEnacQA_BJVKE2pD";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

const LOGIN_URL =
  new URL("./login.html", location.href).href;

const SELLER_URL =
  new URL("./seller.html", location.href).href;

const HOME_URL =
  new URL("./index.html", location.href).href;

const $ = id => document.getElementById(id);

let mode = "login";
let busy = false;

/* ==============================
   UI FUNCTIONS
============================== */

function showMessage(text, type = "error") {
  const element = $("message");
  element.textContent = text;
  element.className = "message " + type;
}

function clearMessage() {
  $("message").textContent = "";
  $("message").className = "message";
}

function setBusy(value) {
  busy = value;
  $("submitBtn").disabled = value;
  $("submitBtn").textContent = value
    ? "Лутфан интизор шавед..."
    : buttonLabel();
}

function buttonLabel() {
  if (mode === "register") return "Ҳисоб сохтан";
  if (mode === "reset") return "Фиристодани пайванд";
  if (mode === "update") return "Нигоҳ доштани парол";
  return "Ворид шудан";
}

function setMode(nextMode) {
  mode = nextMode;
  clearMessage();

  const login = mode === "login";
  const register = mode === "register";
  const reset = mode === "reset";
  const update = mode === "update";

  $("tabs").classList.toggle("hidden", reset || update);
  $("loginTab").classList.toggle("active", login);
  $("registerTab").classList.toggle("active", register);

  $("forgotRow").classList.toggle("hidden", !login);
  $("backBtn").classList.toggle("hidden", !(reset || update));

  $("passwordField").classList.toggle("hidden", reset);
  $("password").required = !reset;
  $("password").autocomplete = login
    ? "current-password"
    : "new-password";

  $("passwordLabel").textContent =
    update ? "Пароли нав" : "Парол";

  $("heading").textContent =
    login ? "Хуш омадед!" :
    register ? "Ба VAYO ҳамроҳ шавед" :
    reset ? "Барқароркунии парол" :
    "Пароли нав гузоред";

  $("subtitle").textContent =
    login
      ? "Ба ҳисоби худ ворид шавед ва харидро оғоз кунед."
    : register
      ? "Ҳисоби ройгон созед ва аз имкониятҳои VAYO истифода баред."
    : reset
      ? "Почтаи электронии худро ворид кунед."
      : "Барои ҳисоби худ пароли нав интихоб кунед.";

  $("submitBtn").textContent = buttonLabel();
}

/* ==============================
   AUTHENTICATION
============================== */

async function handleSubmit(event) {
  event.preventDefault();

  if (busy) return;

  clearMessage();
  setBusy(true);

  const email = $("email").value.trim();
  const password = $("password").value;

  try {

    if (mode === "register") {

      const { data, error } =
        await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: LOGIN_URL
          }
        });

      if (error) throw error;

      if (data.session) {
        showMessage(
          "Ҳисоби шумо бомуваффақият сохта шуд!",
          "success"
        );
        location.assign(SELLER_URL);
        return;
      }

      showMessage(
        "Сабти ном қабул шуд. Email-и худро кушоед ва пайванди тасдиқро пахш кунед.",
        "success"
      );

    } else if (mode === "login") {

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) throw error;

      location.assign(SELLER_URL);
      return;

    } else if (mode === "reset") {

      const { error } =
        await supabaseClient.auth.resetPasswordForEmail(
          email,
          { redirectTo: LOGIN_URL }
        );

      if (error) throw error;

      showMessage(
        "Агар ин email сабт шуда бошад, пайванди барқароркунии парол фиристода мешавад.",
        "success"
      );

    } else if (mode === "update") {

      const { error } =
        await supabaseClient.auth.updateUser({
          password
        });

      if (error) throw error;

      await supabaseClient.auth.signOut();

      setMode("login");

      showMessage(
        "Пароли шумо нав карда шуд. Акнун ворид шавед.",
        "success"
      );
    }

  } catch (error) {
    showMessage(
      error.message || "Хатогӣ рух дод. Боз кӯшиш кунед."
    );
  } finally {
    setBusy(false);
  }
}

/* ==============================
   BUTTON EVENTS
============================== */

$("loginTab").addEventListener("click", () => {
  setMode("login");
});

$("registerTab").addEventListener("click", () => {
  setMode("register");
});

$("forgotBtn").addEventListener("click", () => {
  setMode("reset");
});

$("backBtn").addEventListener("click", () => {
  setMode("login");
});

$("showPassword").addEventListener("click", () => {
  const input = $("password");
  const showing = input.type === "password";

  input.type = showing ? "text" : "password";

  $("showPassword").textContent =
    showing ? "Пинҳон" : "Намоиш";
});

$("authForm").addEventListener("submit", handleSubmit);

/* ==============================
   SESSION AND EMAIL CALLBACK
============================== */

async function initialize() {
  try {
    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        setMode("update");
      }
    });

    const params = new URLSearchParams(location.search);
    const hash = new URLSearchParams(location.hash.slice(1));

    if (
      params.get("type") === "recovery" ||
      hash.get("type") === "recovery"
    ) {
      setMode("update");
    }

    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error) throw error;

    if (data.session && mode === "login") {
      showMessage(
        "Шумо аллакай ворид шудаед. Барои идома тугмаи «Ворид шудан»-ро истифода баред.",
        "success"
      );
    }

  } catch (error) {
    showMessage(
      error.message || "Пайвастшавӣ муваффақ нашуд."
    );
  }
}

initialize();

</script>
</body>
</html>
