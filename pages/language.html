
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7255f5">
<title>VAYO Language — Забономӯзии шавқовар</title>
<style>
:root{
 --purple:#7255f5;--dark:#202044;--muted:#74788e;
 --bg:#f5f5ff;--white:#fff;--line:#e7e7f4;
 --green:#27b879;--red:#f45b70;--gold:#ffbc3d;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--dark)}
button,input{font:inherit}
button{cursor:pointer;border:0}
button:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:1050px;margin:auto;padding:0 15px}
header{background:linear-gradient(120deg,#7255f5,#ad66ff);color:white;padding:18px 0 25px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:900}
.back{color:white;text-decoration:none;background:#ffffff28;padding:10px 14px;border-radius:13px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}
.hero h1{font-size:29px;margin:0 0 8px}
.hero p{margin:0;line-height:1.7}
.mascot{font-size:72px;filter:drop-shadow(0 8px 8px #4224a744)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:17px 0}
.stat{background:white;border:1px solid var(--line);border-radius:17px;padding:14px;text-align:center}
.stat b{display:block;font-size:21px}
.stat small{color:var(--muted)}
.card{background:white;border:1px solid var(--line);border-radius:20px;padding:19px;margin:15px 0;box-shadow:0 5px 20px #35347708}
h2{font-size:21px;margin:0 0 13px}
h3{margin:16px 0 10px}
.muted{color:var(--muted)}
.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.lang{border:2px solid var(--line);background:#fafaff;border-radius:16px;padding:16px 10px;font-weight:bold}
.lang.active{border-color:var(--purple);background:#f0edff}
.lang .flag{font-size:35px;display:block;margin-bottom:9px}
.lang small{display:block;color:var(--muted);margin-top:6px}
.progress{height:13px;background:#e8e8f6;border-radius:30px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#29bf82,#83df73);width:0;transition:width .3s}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:13px}
.unit{border:1px solid var(--line);border-radius:17px;padding:15px;background:#fbfbff}
.unit h3{margin:5px 0 7px}
.unit p{color:var(--muted);font-size:13px;line-height:1.5;min-height:38px}
.unitIcon{font-size:32px}
.unitBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:12px 14px;border-radius:13px;font-weight:bold}
.primary{background:var(--purple);color:white}
.green{background:var(--green);color:white}
.light{background:#eeedfc;color:var(--dark)}
.orange{background:#fff0cf;color:#9b6000}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hidden{display:none!important}
.lessonHeader{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lessonBox{background:#f7f5ff;border-radius:16px;padding:17px;line-height:1.85;white-space:pre-line}
.wordCard{border:2px solid #e9e4ff;border-radius:19px;text-align:center;padding:24px 12px;background:#faf9ff}
.wordMain{font-size:clamp(26px,5vw,40px);font-weight:900;overflow-wrap:anywhere}
.wordMeaning{font-size:20px;color:var(--purple);margin-top:14px}
.wordHint{font-size:13px;color:var(--muted);margin:12px}
.quizOption{display:block;width:100%;text-align:left;background:#f8f8ff;border:2px solid var(--line);border-radius:14px;padding:15px;margin:9px 0;font-weight:bold}
.quizOption.correct{background:#e5faee;border-color:var(--green)}
.quizOption.wrong{background:#ffe9ec;border-color:var(--red)}
.feedback{font-weight:bold;min-height:26px;margin:14px 0}
.chips{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}
.chip{padding:12px;border:2px solid var(--line);border-radius:13px;background:white}
.sentence{min-height:58px;border:2px dashed #c9c3f9;border-radius:13px;padding:12px;display:flex;gap:8px;flex-wrap:wrap}
.achievement{background:#fff8e7;border-radius:15px;padding:14px;margin:10px 0}
table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid var(--line);padding:11px;text-align:left}
footer{text-align:center;color:var(--muted);padding:28px 12px;font-size:13px}
@media(max-width:600px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .hero h1{font-size:23px}.mascot{font-size:52px}
 .card{padding:14px}
 .units{grid-template-columns:1fr}
}
</style>
</head>

</main>

const DATA={};
for(const id of Object.keys(raw)){
 DATA[id]=raw[id].map(unit=>
  unit.split("|").map(pair=>{
   const n=pair.indexOf("=");
   return [pair.slice(0,n),pair.slice(n+1)];
  })
 );
}

const STORAGE="vayo_language_v2";
function load(){
 try{
  const x=JSON.parse(localStorage.getItem(STORAGE)||"null");
  if(x&&typeof x==="object")return x;
 }catch(e){}
 return {lang:"de",xp:0,hearts:5,streak:0,lastDay:"",done:{}};
}
let state=load();
if(!languages.some(l=>l[0]===state.lang))state.lang="de";
if(!state.done||typeof state.done!=="object")state.done={};
state.xp=Number(state.xp)||0;
state.hearts=Math.max(0,Math.min(5,Number(state.hearts)||0));

let session=null;

function save(){
 try{localStorage.setItem(STORAGE,JSON.stringify(state))}
 catch(e){console.warn("Нигоҳдорӣ дастрас нест",e)}
}
function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}
function shuffle(a){
 const b=[...a];
 for(let i=b.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [b[i],b[j]]=[b[j],b[i]];
 }
 return b;
}
function locale(){
 return languages.find(l=>l[0]===state.lang)[3];
}
function speak(s){
 if(!("speechSynthesis" in window)){
  alert("Браузер овозро дастгирӣ намекунад.");
  return;
 }
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(s);
 u.lang=locale();
 u.rate=.82;
 speechSynthesis.speak(u);
}
function today(){
 const d=new Date();
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function updateStreak(){
 const now=today();
 if(state.lastDay===now)return;
 if(state.lastDay){
  const previous=new Date(now+"T12:00:00");
  previous.setDate(previous.getDate()-1);
  const y=`${previous.getFullYear()}-${String(previous.getMonth()+1).padStart(2,"0")}-${String(previous.getDate()).padStart(2,"0")}`;
  state.streak=state.lastDay===y?(state.streak||0)+1:1;
 }else state.streak=1;
 state.lastDay=now;
}
function completed(id,n){
 return !!state.done[id+"_"+n];
}
function completedCount(id){
 return Array.from({length:20},(_,i)=>completed(id,i)).filter(Boolean).length;
}
function render(){
 $("xp").textContent=state.xp;
 $("hearts").textContent="❤️".repeat(state.hearts)||"♡";
 $("streak").textContent=(state.streak||0)+" 🔥";
 $("level").textContent=Math.floor(state.xp/200)+1;

 $("languages").innerHTML=languages.map(l=>`
  <button class="lang ${state.lang===l[0]?"active":""}"
  onclick="selectLang('${l[0]}')">
   <span class="flag">${l[1]}</span>${l[2]}
   <small>${completedCount(l[0])}/20 дарс</small>
  </button>`).join("");

 const name=languages.find(l=>l[0]===state.lang)[2];
 const done=completedCount(state.lang);
 $("courseTitle").textContent="📚 Забони "+name;
 $("progressText").textContent=done+" аз 20 дарс анҷом ёфт";
 $("progressFill").style.width=(done/20*100)+"%";

 $("units").innerHTML=topics.map((t,i)=>{
  const a=i*2,b=a+1;
  return `<div class="unit">
   <div class="unitIcon">${t[0]}</div>
   <h3>Бахши ${i+1}: ${t[1]}</h3>
   <p>${t[2]}</p>
   <div class="unitBtns">
    <button class="btn ${completed(state.lang,a)?"green":"primary"}"
     onclick="startLesson(${a})">
     ${completed(state.lang,a)?"✓ ":""}Дарси ${a+1}
    </button>
    <button class="btn ${completed(state.lang,b)?"green":"orange"}"
     onclick="startLesson(${b})">
     ${completed(state.lang,b)?"✓ ":""}Машқи ${b+1}
    </button>
   </div>
  </div>`;
 }).join("");

 const total=Object.keys(state.done).filter(k=>state.done[k]).length;
 $("summary").innerHTML=`
 <p>📖 Дарсҳои анҷомёфта дар ҳамаи забонҳо: <b>${total}</b> аз 100</p>
 <p>⚡ XP-и ҷамъшуда: <b>${state.xp}</b></p>
 <p>🏆 Сатҳи ҳозира: <b>${Math.floor(state.xp/200)+1}</b></p>
 <p class="muted">Пешрафт дар ҳамин браузер нигоҳ дошта мешавад.</p>`;

 const badges=[
  [total>=1,"🌟 Қадами аввал","Аввалин дарс анҷом ёфт"],
  [total>=10,"🥉 Омӯзандаи фаъол","10 дарс анҷом ёфт"],
  [total>=30,"🥈 Донишҷӯи пешқадам","30 дарс анҷом ёфт"],
  [total>=100,"🥇 Устоди панҷ забон","100 дарс анҷом ёфт"],
  [(state.streak||0)>=7,"🔥 Ҳафт рӯз","7 рӯз пайдарпай омӯзиш"]
 ];
 $("achievements").innerHTML=badges.map(b=>
  `<div class="achievement" style="opacity:${b[0]?1:.48}">
   <b>${b[1]}</b><div class="muted">${b[2]}</div>
   </div>`
 ).join("");
}

function selectLang(id){
 if(!DATA[id])return;
 if("speechSynthesis" in window)speechSynthesis.cancel();
 state.lang=id;save();closeLesson();render();
}
function closeLesson(){
 $("lesson").classList.add("hidden");
 $("home").classList.remove("hidden");
 $("course").classList.remove("hidden");
 session=null;
 if("speechSynthesis" in window)speechSynthesis.cancel();
}
function startLesson(n){
 if(n<0||n>=20)return;
 if(state.hearts===0){
  alert("❤️ Дилҳо тамом шуданд. Барои барқарор кардани онҳо дарси такрориро истифода баред.");
  return;
 }
 const unit=Math.floor(n/2);
 const practice=n%2===1;
 const words=DATA[state.lang][unit];
 session={
  n,unit,practice,words,step:0,score:0,
  answered:false,selected:[],question:null,
  questions:practice?makeQuestions(words):[]
 };
 $("home").classList.add("hidden");
 $("course").classList.add("hidden");
 $("lesson").classList.remove("hidden");
 $("lessonTitle").textContent=
  `${topics[unit][0]} ${practice?"Машқ":"Дарс"} ${n+1}: ${topics[unit][1]}`;
 $("feedback").textContent="";
 showStep();
 $("lesson").scrollIntoView({behavior:"smooth"});
}
function makeQuestions(words){
 const q=[];
 words.forEach((w,i)=>{
  q.push({type:"translate",index:i});
 });
 q.push({type:"listen",index:Math.floor(Math.random()*words.length)});
 q.push({type:"reverse",index:Math.floor(Math.random()*words.length)});
 return shuffle(q);
}
function showStep(){
 if(!session)return;
 const s=session;
 $("feedback").textContent="";
 $("continueBtn").disabled=false;
 $("continueBtn").textContent="Давом додан →";
 const total=s.practice?s.questions.length:s.words.length+2;
 $("lessonCounter").textContent=`${Math.min(s.step+1,total)} / ${total}`;
 $("lessonProgress").style.width=(Math.min(s.step,total)/total*100)+"%";

 if(!s.practice){
  showStudyStep();
 }else{
  showQuestion();
 }
}
function showStudyStep(){
 const s=session;
 const body=$("lessonBody");
 if(s.step===0){
  body.innerHTML=`
  <div class="lessonBox">
   <b>👩‍🏫 Шарҳи дарс</b>

   ${esc(explanations[s.unit])}

   🎯 Мақсад:
   ${esc(topics[s.unit][2])}

   Дар ин дарс панҷ калима ё ибора меомӯзӣ.
   Тугмаи 🔊-ро пахш карда талаффузро гӯш кун.
   Баъд ҳар ибораро се бор такрор намо.
  </div>`;
  return;
 }
 if(s.step<=s.words.length){
  const i=s.step-1;
  const w=s.words[i];
  body.innerHTML=`
  <div class="wordCard">
   <div class="muted">Калимаи ${i+1} аз ${s.words.length}</div>
   <div class="wordMain" style="margin-top:20px">${esc(w[0])}</div>
   <div class="wordMeaning">${esc(w[1])}</div>
   <div class="wordHint">Гӯш кун, такрор намо ва дар хотир нигоҳ дор.</div>
   <button class="btn primary" onclick="speakCurrent()">🔊 Гӯш кардан</button>
  </div>`;
  return;
 }
 body.innerHTML=`
 <div class="lessonBox">
  <b>🎉 Дарсро омӯхтӣ!</b>

  Акнун вақти санҷиши дониш аст.
  Ба бахши машқ гузар ва маънои калимаҳои
  ҳамин дарсро санҷ.

  Барои беҳтар ёд гирифтан, калимаҳои навро
  дар давоми рӯз чанд бор такрор кун.
 </div>`;
 $("continueBtn").textContent="Анҷом додани дарс ✓";
}
function speakCurrent(){
 if(!session)return;
 const i=session.step-1;
 if(session.words[i])speak(session.words[i][0]);
}
function showQuestion(){
 const s=session;
 if(s.step>=s.questions.length){
  finishLesson();return;
 }
 s.answered=false;
 const q=s.questions[s.step];
 s.question=q;
 const w=s.words[q.index];
 const choices=shuffle(s.words.map(x=>
  q.type==="reverse"?x[0]:x[1]
 ));
 let title="",hint="";
 if(q.type==="translate"){
  title=`«${w[0]}» чӣ маъно дорад?`;
  hint="Ҷавоби дурустро интихоб кун.";
 }else if(q.type==="reverse"){
  title=`«${w[1]}» бо забони омӯхташаванда чӣ мешавад?`;
  hint="Тарҷумаи мувофиқро ёб.";
 }else{
  title="🔊 Ибораро гӯш кун. Маънояш чист?";
  hint="Тугмаи овозро пахш кун.";
 }
 $("lessonBody").innerHTML=`
  <div class="lessonBox">
   <b>🧩 Саволи ${s.step+1} аз ${s.questions.length}</b>
   <h3>${esc(title)}</h3>
   <p class="muted">${hint}</p>
   ${q.type==="listen"?
    '<button class="btn primary" onclick="speakQuestion()">🔊 Гӯш кардан</button>':""}
  </div>
  <div id="options"></div>`;
 const correct=q.type==="reverse"?w[0]:w[1];
 const container=$("options");
 choices.forEach(value=>{
  const b=document.createElement("button");
  b.className="quizOption";
  b.textContent=value;
  b.onclick=()=>answerQuestion(b,value,correct);
  container.appendChild(b);
 });
 $("continueBtn").disabled=true;
}
function speakQuestion(){
 if(!session||!session.question)return;
 speak(session.words[session.question.index][0]);
}
function answerQuestion(button,value,correct){
 const s=session;
 if(!s||s.answered)return;
 s.answered=true;
 const right=value===correct;
 const buttons=$("options").querySelectorAll("button");
 buttons.forEach(b=>{
  b.disabled=true;
  if(b.textContent===correct)b.classList.add("correct");
 });
 if(right){
  s.score++;
  $("feedback").textContent="✅ Офарин! Ҷавоби дуруст.";
 }else{
  button.classList.add("wrong");
  state.hearts=Math.max(0,state.hearts-1);
  $("feedback").textContent="❌ Ҷавоби дуруст: "+correct;
  save();render();
 }
 $("continueBtn").disabled=false;
 $("continueBtn").textContent=
  s.step===s.questions.length-1?"Натиҷаро дидан →":"Саволи навбатӣ →";
}
function continueLesson(){
 if(!session)return;
 const s=session;
 if(s.practice){
  if(!s.answered)return;
  s.step++;
  if(s.step>=s.questions.length){
   finishLesson();return;
  }
 }else{
  if(s.step>=s.words.length+1){
   finishLesson();return;
  }
  s.step++;
 }
 showStep();
}
function finishLesson(){
 const s=session;
 if(!s)return;
 const total=s.practice?s.questions.length:0;
 const passed=!s.practice||s.score>=Math.ceil(total*.7);
 const already=completed(state.lang,s.n);
 let reward=0;
 if(passed&&!already){
  reward=s.practice?40:20;
  state.xp+=reward;
  state.done[state.lang+"_"+s.n]=true;
  updateStreak();
 }
 if(passed&&s.practice){
  state.hearts=Math.min(5,state.hearts+1);
 }
 save();
 render();
 $("lessonProgress").style.width="100%";
 $("lessonCounter").textContent="Анҷом";
 $("lessonBody").innerHTML=`
 <div class="wordCard">
  <div style="font-size:65px">${passed?"🏆":"💪"}</div>
  <h2>${passed?"Табрик!":"Боз як бор кӯшиш кун!"}</h2>
  <p>${s.practice?`Ҷавобҳои дуруст: ${s.score} аз ${total}`:"Панҷ калима ва шарҳи дарсро омӯхтӣ."}</p>
  <h2>${passed?"+"+reward+" XP":"Барои гузаштан 70% лозим аст"}</h2>
  <p class="muted">${already?"Ин дарс пештар анҷом ёфта буд.":""}</p>
 </div>`;
 $("feedback").textContent=passed?
  "🌟 Офарин! Омӯзишро давом деҳ.":"Ҷавобҳоро такрор карда, аз нав санҷ.";
 $("continueBtn").disabled=false;
 $("continueBtn").textContent="Ба харитаи дарсҳо →";
 $("continueBtn").onclick=()=>{
  $("continueBtn").onclick=continueLesson;
  closeLesson();
  render();
 };
 session=null;
}
render();
</script>
</body>
</html>
