
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7255f5">
<title>VAYO Language — Забономӯзӣ</title>
<style>
:root{
 --main:#7255f5;--bg:#f5f5ff;--ink:#252344;
 --muted:#77788d;--line:#e7e5f4;--green:#25b67a;
 --red:#ed5268
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
button{font:inherit;cursor:pointer;border:0}
button:disabled{opacity:.5;cursor:not-allowed}
header{background:linear-gradient(120deg,#6650e9,#a968f5);color:white;padding:22px 15px}
.wrap{max-width:1050px;margin:auto;padding:0 14px}
header h1{margin:12px 0 5px}
header p{opacity:.9}
a{color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:24px;font-weight:900}
.back{padding:10px;background:#ffffff25;border-radius:12px;text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:17px 0}
.stat,.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px}
.stat{text-align:center}
.stat b{display:block;font-size:21px}
small,.muted{color:var(--muted)}
.card{margin:14px 0}
h2{margin:0 0 13px;font-size:21px}
h3{margin:12px 0}
.langs,.levels,.topics{display:grid;gap:10px}
.langs{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.levels{grid-template-columns:repeat(3,1fr)}
.topics{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.choice{
 background:#faf9ff;border:2px solid var(--line);
 border-radius:14px;padding:13px;text-align:center
}
.choice.active{border-color:var(--main);background:#efebff}
.flag{display:block;font-size:31px;margin-bottom:8px}
.choice b{display:block}
.topic{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fdfcff}
.topic p{font-size:13px;color:var(--muted);line-height:1.5}
.topicButtons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border-radius:12px;padding:12px;font-weight:bold}
.primary{background:var(--main);color:white}
.green{background:var(--green);color:white}
.light{background:#eeebfa;color:var(--ink)}
.progress{height:12px;background:#eae9f5;border-radius:20px;overflow:hidden;margin:10px 0}
.fill{height:100%;width:0;background:var(--green);transition:width .25s}
.hidden{display:none!important}
.study{
 background:#f7f5ff;border:1px solid #e7e1ff;
 padding:20px;border-radius:16px;line-height:1.8;
 margin:15px 0;overflow-wrap:anywhere
}
.study strong{font-size:23px}
.translation{color:#6550d7;font-size:18px}
.option{
 display:block;width:100%;padding:14px;margin:9px 0;
 border:2px solid var(--line);border-radius:13px;
 background:#faf9ff;text-align:left;overflow-wrap:anywhere
}
.option.correct{background:#e4f9ed;border-color:var(--green)}
.option.wrong{background:#ffe8ed;border-color:var(--red)}
.notice{padding:13px;background:#fff7e7;border-radius:12px;color:#805b1b;line-height:1.6}
.badgeLine{padding:12px;background:#fff8e9;border-radius:12px;margin:8px 0}
.lessonActions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer{text-align:center;padding:25px;color:var(--muted);font-size:13px}
@media(max-width:600px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .levels{grid-template-columns:repeat(3,1fr)}
 .topics{grid-template-columns:1fr}
 .stat{padding:12px 6px}
 .card{padding:13px}
}
</style>
</head>

<header>
 <div class="wrap">
  <div class="top">
   <div class="logo">🌈 VAYO Language</div>
   <a href="../index.html" class="back">← VAYO</a>
  </div>
  <h1>Забон омӯз, ҷаҳонро кушо!</h1>

</header>

<main class="wrap">

<div class="stats">
 <div class="stat"><b id="xp">0</b><small>⚡ XP</small></div>

 <div class="stat"><b id="streak">🔥 0</b><small>Рӯзҳои пайдарпай</small></div>
 <div class="stat"><b id="xpLevel">1</b><small>🏆 Сатҳи XP</small></div>
</div>

<section class="card" id="home">
 <h2>🌍 Забонро интихоб кун</h2>
 <div id="languages" class="langs"></div>
</section>

<section class="card" id="levelSection">
 <h2>🎓 Сатҳи забон</h2>
 <div id="levels" class="levels"></div>
</section>

<section class="card" id="course">
 <h2 id="courseTitle">📚 Дарсҳо</h2>
 <p id="progressText" class="muted"></p>
 <div class="progress"><div class="fill" id="progressFill"></div></div>
 <div id="notice"></div>
 <div class="topics" id="topics" style="margin-top:15px"></div>
</section>

<section class="card hidden" id="lesson">

  <button class="btn light" onclick="closeLesson()">← Баргаштан</button>
  <span class="muted" id="counter"></span>

 <div class="progress"><div class="fill" id="lessonFill"></div></div>
 <div id="lessonBody"></div>
 <p id="feedback" aria-live="polite"></p>
 <button class="btn primary" id="nextBtn" onclick="nextStep()">Давом додан →</button>
</section>

<section class="card">
 <h2>🏅 Мукофотҳо</h2>
 <div id="achievements"></div>
</section>

<section class="card">
 <h2>📊 Омори омӯзиш</h2>
 <div id="summary"></div>
</section>

</main>
<footer>VAYO Language • Бе овоз • Бе API-и пулакӣ</footer>

 return s.split("|").map(p=>{
  const i=p.indexOf("=");
  return [p.slice(0,i),p.slice(i+1)];
 });
}

/*
 Нигоҳдории пешрафт.
 Калиди пешинаи A1 тағйир намеёбад.
*/

const OLD_KEY="vayo_language_v2";
const NEW_KEY="vayo_language_extended_v1";

function readJSON(key,fallback){
 try{
  const v=JSON.parse(localStorage.getItem(key)||"null");
  return v&&typeof v==="object"?v:fallback;
 }catch(e){return fallback}
}

const state=readJSON(OLD_KEY,{
 lang:"de",xp:0,hearts:5,streak:0,lastDay:"",done:{}
});

state.lang=LANGUAGES.some(x=>x[0]===state.lang)?state.lang:"de";
state.xp=Number(state.xp)||0;
state.hearts=Number.isFinite(Number(state.hearts))?
 Math.max(0,Math.min(5,Number(state.hearts))):5;
state.streak=Number(state.streak)||0;
if(!state.done||typeof state.done!=="object")state.done={};

const extended=readJSON(NEW_KEY,{done:{},level:"A1"});
if(!extended.done||typeof extended.done!=="object")extended.done={};
if(!LEVELS.some(x=>x[0]===extended.level))extended.level="A1";

let selectedLevel=extended.level;
let session=null;
let finished=false;

function save(){
 try{
  localStorage.setItem(OLD_KEY,JSON.stringify(state));
  extended.level=selectedLevel;
  localStorage.setItem(NEW_KEY,JSON.stringify(extended));
 }catch(e){console.warn("Нигоҳдорӣ дастрас нест",e)}
}

function esc(v){
 return String(v).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}

function shuffle(items){
 const a=[...items];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function localDay(date){
 return date.getFullYear()+"-"+
 String(date.getMonth()+1).padStart(2,"0")+"-"+
 String(date.getDate()).padStart(2,"0");
}

function updateStreak(){
 const today=localDay(new Date());
 if(state.lastDay===today)return;
 const yesterday=new Date();
 yesterday.setDate(yesterday.getDate()-1);
 state.streak=state.lastDay===localDay(yesterday)?
  state.streak+1:1;
 state.lastDay=today;
}

function doneKey(lang,level,topic,type){
 return lang+"_"+level+"_"+topic+"_"+type;
}

function isDone(lang,level,topic,type){
 if(level==="A1"){
  const oldIndex=topic*2+type;
  return !!state.done[lang+"_"+oldIndex]||
   !!extended.done[doneKey(lang,level,topic,type)];
 }
 return !!extended.done[doneKey(lang,level,topic,type)];
}

function totalLessons(level){
 if(level==="A1")return 20;
 if(level==="A2")return 20*4;
 return 0;
}

function doneCount(lang,level){
 let n=0;
 const count=LEVEL_TOPICS[level].length;
 const types=level==="A1"?2:level==="A2"?4:0;
 for(let i=0;i<count;i++){
  for(let j=0;j<types;j++){
   if(isDone(lang,level,i,j))n++;
  }
 }
 return n;
}

function selectLang(lang){
 if(!A1[lang])return;
 state.lang=lang;
 save();
 closeLesson();
}

function selectLevel(level){
 if(!LEVEL_TOPICS[level])return;
 selectedLevel=level;
 save();
 closeLesson();
}

function render(){
 $("xp").textContent=state.xp;
 $("hearts").textContent="❤️ "+state.hearts;
 $("streak").textContent="🔥 "+state.streak;
 $("xpLevel").textContent=Math.floor(state.xp/200)+1;

 $("languages").innerHTML=LANGUAGES.map(l=>`
  <button class="choice ${state.lang===l[0]?"active":""}"
   onclick="selectLang('${l[0]}')">
   <span class="flag">${l[1]}</span>
   <b>${l[2]}</b>
  </button>
 `).join("");

 $("levels").innerHTML=LEVELS.map(l=>`
  <button class="choice ${selectedLevel===l[0]?"active":""}"
   onclick="selectLevel('${l[0]}')">
   <b style="font-size:22px">${l[0]}</b>
   <small>${l[1]}</small>
  </button>
 `).join("");

 const name=LANGUAGES.find(x=>x[0]===state.lang)[2];
 const done=doneCount(state.lang,selectedLevel);
 const total=totalLessons(selectedLevel);

 $("courseTitle").textContent="📚 "+name+" — "+selectedLevel;
 $("progressText").textContent=total?
  "Анҷомёфта: "+done+" аз "+total:
  "Нақшаи омӯзиш: "+LEVEL_TOPICS[selectedLevel].length+" мавзӯъ";

 $("progressFill").style.width=total?done/total*100+"%":"0%";

 $("notice").innerHTML=selectedLevel==="A1"?
  '<div class="notice">Дарсҳои аслии A1 бо луғат ва машқҳо фаъоланд.</div>':
  selectedLevel==="A2"?
  '<div class="notice">A2: 20 мавзӯъ барои ҳар забон. Ҳар мавзӯъ луғат, ҷумла, грамматика ва тест дорад. Ин муҳтавои ибтидоии курс аст.</div>':
  '<div class="notice">Мавзӯъҳои '+selectedLevel+
  ' ҳоло нақша мебошанд. Дарсҳои воқеии ин сатҳ ҳанӯз илова нашудаанд.</div>';

 renderTopics();
 renderSummary();
}

 $("topics").innerHTML=list.map((name,i)=>{
  let buttons="";

  if(selectedLevel==="A1"){
   buttons=`
    <button class="btn ${isDone(state.lang,"A1",i,0)?"green":"primary"}"
     onclick="startLesson(${i},0)">
     📖 Дарси ${i*2+1}
    </button>
    <button class="btn ${isDone(state.lang,"A1",i,1)?"green":"primary"}"
     onclick="startLesson(${i},1)">
     🧩 Машқи ${i*2+2}
    </button>
   `;
  }else if(selectedLevel==="A2"){
   const labels=["📖 Луғат","💬 Ҷумла","📚 Грамматика","🧩 Тест"];
   buttons=labels.map((label,j)=>`
    <button class="btn ${isDone(state.lang,"A2",i,j)?"green":"primary"}"
     onclick="startLesson(${i},${j})">
     ${label}
    </button>
   `).join("");
  }else{
   buttons='<span class="muted">🔒 Дар ҳоли омодасозӣ</span>';
  }

  return `
   <div class="topic">
    <h3>${i+1}. ${esc(name)}</h3>
    <p>${selectedLevel==="A2"?
      "Луғат, ҷумла, грамматика ва санҷиш":
      selectedLevel==="A1"?
      "Омӯзиш ва машқ":
      "Нақшаи мавзӯъ"}</p>
    <div class="topicButtons">${buttons}</div>
   </div>
  `;
 }).join("");
}

function renderSummary(){
 const allA1=LANGUAGES.reduce((n,l)=>
  n+doneCount(l[0],"A1"),0);
 const allA2=LANGUAGES.reduce((n,l)=>
  n+doneCount(l[0],"A2"),0);

 $("summary").innerHTML=`
  <p>📗 A1: <b>${allA1}/100</b> дарс</p>
  <p>📘 A2: <b>${allA2}/400</b> зердарс</p>
  <p>⚡ XP: <b>${state.xp}</b></p>
  <p>🔥 Рӯзҳои пайдарпай: <b>${state.streak}</b></p>
  <p class="muted">Пешрафт дар ҳамин браузер нигоҳ дошта мешавад.</p>
 `;

 const awards=[
  [allA1+allA2>=1,"🌟 Қадами аввал"],
  [allA1+allA2>=10,"🥉 Омӯзандаи фаъол"],
  [allA1+allA2>=50,"🥈 Донишҷӯи пешқадам"],
  [allA1+allA2>=100,"🥇 Сад дарс"],
  [state.streak>=7,"🔥 Ҳафт рӯзи пайдарпай"]
 ];

 $("achievements").innerHTML=awards.map(x=>`
  <div class="badgeLine" style="opacity:${x[0]?1:.45}">
   ${x[1]} ${x[0]?"✓":"🔒"}
  </div>
 `).join("");
}

function closeLesson(){
 session=null;
 finished=false;
 $("lesson").classList.add("hidden");
 $("home").classList.remove("hidden");
 $("levelSection").classList.remove("hidden");
 $("course").classList.remove("hidden");
 render();
}

function startLesson(topic,type){
 if(!["A1","A2"].includes(selectedLevel))return;
 if(state.hearts<=0){
  alert("❤️ Дилҳо тамом шудаанд.");
  return;
 }

 const level=selectedLevel;
 const lang=state.lang;

 session={
  lang,level,topic,type,
  step:0,score:0,answered:false,
  questions:[]
 };

 finished=false;

 if(level==="A1"){
  const words=A1[lang][topic];
  if(type===1){
   session.questions=buildWordQuestions(words,5);
  }
 }else{
  const data=A2[lang][topic];
  if(type===3){
   session.questions=buildA2Questions(lang,topic);
  }
 }

 $("home").classList.add("hidden");
 $("levelSection").classList.add("hidden");
 $("course").classList.add("hidden");
 $("lesson").classList.remove("hidden");

 $("lessonTitle").textContent=
  level+" — "+LEVEL_TOPICS[level][topic];

 showStep();
 $("lesson").scrollIntoView({behavior:"smooth"});
}

function buildWordQuestions(words,count){
 return shuffle(words).slice(0,count).map(w=>({
  question:"«"+w[0]+"» чӣ маъно дорад?",
  correct:w[1],
  pool:words.map(x=>x[1])
 }));
}

function buildA2Questions(lang,topic){
 const data=A2[lang][topic];
 const wordPool=A2[lang].flatMap(x=>x.words.map(w=>w[1]));
 const sentencePool=A2[lang].map(x=>x.sentence[1]);
 const grammarPool=GRAMMAR[lang].map(x=>x[3]);

 return [
  ...data.words.map(w=>({
   question:"«"+w[0]+"» чӣ маъно дорад?",
   correct:w[1],
   pool:wordPool
  })),
  {
   question:"«"+data.sentence[0]+"» чӣ маъно дорад?",
   correct:data.sentence[1],
   pool:sentencePool
  },
  {
   question:"«"+data.grammar[2]+"» чӣ маъно дорад?",
   correct:data.grammar[3],
   pool:grammarPool
  }
 ];
}

function choicesFor(q){
 const unique=[...new Set(q.pool)].filter(x=>x!==q.correct);
 const alternatives=shuffle(unique).slice(0,3);
 return shuffle([q.correct,...alternatives]);
}

function showStep(){
 if(!session||finished)return;
 const s=session;

 $("feedback").textContent="";
 $("nextBtn").disabled=false;
 $("nextBtn").textContent="Давом додан →";

 if(s.level==="A1"&&s.type===0){
  showA1Study();
  return;
 }

 if(s.level==="A2"&&s.type!==3){
  showA2Study();
  return;
 }

 showQuiz();
}

function showA1Study(){
 const s=session;
 const words=A1[s.lang][s.topic];
 const total=words.length;

 $("counter").textContent=
  Math.min(s.step+1,total)+" / "+total;
 $("lessonFill").style.width=(s.step/total*100)+"%";

 const w=words[Math.min(s.step,total-1)];

 $("lessonBody").innerHTML=`
  <div class="study" style="text-align:center">
   <strong>${esc(w[0])}</strong>
   <div class="translation">${esc(w[1])}</div>
   <p class="muted">Калима ва тарҷумаашро дар хотир нигоҳ дор.</p>
  </div>
 `;

 if(s.step===total-1){
  $("nextBtn").textContent="Анҷом додан ✓";
 }
}

function showA2Study(){
 const s=session;
 const data=A2[s.lang][s.topic];

 $("counter").textContent="Омӯзиш";
 $("lessonFill").style.width="50%";

 let html="";

 if(s.type===0){
  html=`
   <h3>📖 Луғати асосӣ</h3>
   ${data.words.map(w=>`
    <div class="study">
     <strong>${esc(w[0])}</strong>
     <div class="translation">${esc(w[1])}</div>
    </div>
   `).join("")}
  `;
 }else if(s.type===1){
  html=`
   <h3>💬 Ҷумлаи муҳим</h3>
   <div class="study">
    <strong>${esc(data.sentence[0])}</strong>
    <div class="translation">${esc(data.sentence[1])}</div>
   </div>
  `;
 }else{
  html=`
   <h3>📚 ${esc(data.grammar[0])}</h3>
   <div class="study">
    <p>${esc(data.grammar[1])}</p>
    <strong>${esc(data.grammar[2])}</strong>
    <div class="translation">${esc(data.grammar[3])}</div>
   </div>
  `;
 }

 $("lessonBody").innerHTML=html;
 $("nextBtn").textContent="Анҷом додан ✓";
}

function showQuiz(){
 const s=session;

 if(s.step>=s.questions.length){
  finishLesson();
  return;
 }

 s.answered=false;
 const q=s.questions[s.step];
 const total=s.questions.length;

 $("counter").textContent=(s.step+1)+" / "+total;
 $("lessonFill").style.width=(s.step/total*100)+"%";

 $("lessonBody").innerHTML=`
  <div class="study">
   <h3>🧩 Саволи ${s.step+1}</h3>
   <strong>${esc(q.question)}</strong>
  </div>
  <div id="options"></div>
 `;

 const box=$("options");

 choicesFor(q).forEach(value=>{
  const btn=document.createElement("button");
  btn.className="option";
  btn.textContent=value;
  btn.onclick=()=>answerQuestion(btn,value,q.correct);
  box.appendChild(btn);
 });

 $("nextBtn").disabled=true;
}

function answerQuestion(button,value,correct){
 if(!session||session.answered)return;
 session.answered=true;

 const right=value===correct;

 if(right){
  session.score++;
  $("feedback").textContent="✅ Офарин!";
 }else{
  state.hearts=Math.max(0,state.hearts-1);
  $("feedback").textContent="❌ Ҷавоби дуруст: "+correct;
  save();
  $("hearts").textContent="❤️ "+state.hearts;
 }

 $("options").querySelectorAll("button").forEach(btn=>{
  btn.disabled=true;
  if(btn.textContent===correct)btn.classList.add("correct");
 });

 if(!right)button.classList.add("wrong");
 $("nextBtn").disabled=false;
 $("nextBtn").textContent="Саволи навбатӣ →";
}

function nextStep(){
 if(!session||finished)return;
 const s=session;

 const isQuiz=(s.level==="A1"&&s.type===1)||
  (s.level==="A2"&&s.type===3);

 if(isQuiz){
  if(!s.answered)return;
  s.step++;
  if(s.step>=s.questions.length){
   finishLesson();
  }else{
   showStep();
  }
  return;
 }

 if(s.level==="A1"){
  s.step++;
  if(s.step>=A1[s.lang][s.topic].length){
   finishLesson();
  }else{
   showStep();
  }
  return;
 }

 finishLesson();
}

function finishLesson(){
 if(!session||finished)return;

 finished=true;
 const s=session;

 const isQuiz=(s.level==="A1"&&s.type===1)||
  (s.level==="A2"&&s.type===3);

 const total=s.questions.length;
 const passed=!isQuiz||
  s.score>=Math.ceil(total*.7);

 const already=isDone(s.lang,s.level,s.topic,s.type);
 let reward=0;

 if(passed&&!already){
  reward=isQuiz?40:20;
  state.xp+=reward;

  if(s.level==="A1"){
   state.done[s.lang+"_"+(s.topic*2+s.type)]=true;
  }else{
   extended.done[doneKey(
    s.lang,s.level,s.topic,s.type
   )]=true;
  }

  updateStreak();
 }

 if(passed&&isQuiz){
  state.hearts=Math.min(5,state.hearts+1);
 }

 save();

 $("lessonFill").style.width="100%";
 $("counter").textContent="Анҷом";

 $("lessonBody").innerHTML=`
  <div class="study" style="text-align:center">
   <div style="font-size:55px">${passed?"🏆":"💪"}</div>
   <h2>${passed?"Табрик!":"Боз кӯшиш кун!"}</h2>
   <p>${isQuiz?
    "Ҷавобҳои дуруст: "+s.score+" аз "+total:
    "Дарси омӯзиширо анҷом додӣ."}</p>
   <h2>${passed?"+"+reward+" XP":"70% ҷавоби дуруст лозим аст"}</h2>
   ${already?"<p>Ин дарс пештар анҷом ёфта буд.</p>":""}
  </div>
 `;

 $("feedback").textContent=passed?
  "🌟 Омӯзишро давом деҳ.":
  "Машқро такрор кун.";

 $("nextBtn").disabled=false;
 $("nextBtn").textContent="Ба мавзӯъҳо →";
 $("nextBtn").onclick=closeLesson;

 session=null;
 renderStatsOnly();
}

function renderStatsOnly(){
 $("xp").textContent=state.xp;
 $("hearts").textContent="❤️ "+state.hearts;
 $("streak").textContent="🔥 "+state.streak;
 $("xpLevel").textContent=Math.floor(state.xp/200)+1;
 renderSummary();
}

render();
</script>
</body>
</html>
