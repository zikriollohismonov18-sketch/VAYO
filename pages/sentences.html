
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7355ef">
<title>VAYO — Ҷумла сохтан</title>
<style>
:root{
 --purple:#7355ef;
 --green:#20b276;
 --red:#e84c68;
 --ink:#25213c;
 --bg:#f6f5fc;
 --line:#e7e4f3
}
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 color:var(--ink);
 background:var(--bg)
}
header{
 padding:22px 15px;
 color:white;
 background:linear-gradient(125deg,#6247db,#a36cf4)
}
.wrap{max-width:780px;margin:auto;padding:15px}
header h1{margin:12px 0}
.back{
 color:white;
 text-decoration:none;
 display:inline-block;
 padding:10px;
 background:#ffffff25;
 border-radius:10px
}
.card{
 background:white;
 border:1px solid var(--line);
 border-radius:18px;
 padding:18px;
 margin:15px 0
}
.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px
}
.stat{text-align:center}
.stat b{font-size:22px;display:block}
.stat small{color:#77758b}
select{
 width:100%;
 padding:14px;
 font-size:16px;
 border:2px solid var(--line);
 border-radius:12px;
 background:white
}
button{
 cursor:pointer;
 font:inherit;
 border:0
}
.btn{
 padding:13px 17px;
 border-radius:12px;
 font-weight:bold
}
.primary{background:var(--purple);color:white}
.green{background:var(--green);color:white}
.light{background:#eeebfa;color:var(--ink)}
.actions{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-top:16px
}
.question{
 background:#f4f1ff;
 padding:25px 12px;
 text-align:center;
 border-radius:16px;
 margin:18px 0
}
.question strong{
 display:block;
 margin-top:10px;
 font-size:24px;
 line-height:1.5
}
.answer{
 min-height:90px;
 padding:12px;
 border:2px dashed #aaa0ed;
 border-radius:14px;
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 align-items:center;
 margin:15px 0
}
.words{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin:18px 0;
 min-height:60px
}
.word{
 padding:12px 15px;
 border-radius:11px;
 background:#ede9ff;
 color:#282041;
 border:1px solid #d6cff9;
 font-weight:bold
}
.word:disabled{opacity:.3;cursor:default}
.selected{background:#ded6ff}
.progress{
 height:12px;
 border-radius:20px;
 background:#e8e6f3;
 overflow:hidden;
 margin:15px 0
}
.fill{
 height:100%;
 background:var(--green);
 width:0%;
 transition:width .2s
}
.feedback{
 padding:15px;
 border-radius:12px;
 margin-top:15px;
 line-height:1.6
}
.correct{background:#e4f9ed;color:#166c46}
.wrong{background:#ffe7ed;color:#982640}
.hidden{display:none!important}
button:focus-visible,select:focus-visible{
 outline:3px solid #a99af7;
 outline-offset:2px
}
</style>
</head>
<body>

<header>
 <div class="wrap">
  <a class="back" href="language.html">
   ← VAYO Language
  </a>
  <h1>🧩 Ҷумла сохтан</h1>
  <p>Калимаҳоро интихоб кун ва ҷумлаи дуруст соз!</p>
 </div>
</header>

<main class="wrap">

 <div class="stats">
  <div class="card stat">
   <b id="xp">0</b>
   <small>⚡ XP</small>
  </div>
  <div class="card stat">
   <b id="score">0</b>
   <small>✅ Дуруст</small>
  </div>
  <div class="card stat">
   <b id="counter">0/10</b>
   <small>🧩 Савол</small>
  </div>
 </div>

 <section class="card">
  <h2>🌍 Забонро интихоб кун</h2>
  <select id="language">
   <option value="de">🇩🇪 Олмонӣ</option>
   <option value="en">🇬🇧 Англисӣ</option>
   <option value="ru">🇷🇺 Русӣ</option>
   <option value="zh">🇨🇳 Чинӣ</option>
   <option value="ko">🇰🇷 Кореягӣ</option>
  </select>

  <h3>🎓 Сатҳ</h3>
  <select id="level">
   <option value="A1">A1 — Оғозӣ</option>
   <option value="A2">A2 — Ибтидоӣ</option>
  </select>

  <button id="start" class="btn primary"
   style="width:100%;margin-top:16px">
   ▶ Оғози машқ
  </button>
 </section>

 <section id="exercise" class="card hidden">
  <h2>🧩 Ҷумларо бисоз</h2>
  <div class="progress">
   <div id="bar" class="fill"></div>
  </div>

  <div class="question">
   <small>Ба забони интихобшуда ҷумла соз:</small>
   <strong id="question"></strong>
  </div>

  <h3>Ҷавоби ту:</h3>
  <div id="answer" class="answer"></div>

  <h3>Калимаҳо:</h3>
  <div id="words" class="words"></div>

  <div id="feedback" class="feedback hidden"></div>

  <div class="actions">
   <button id="undo" class="btn light">
    ↩ Як калима баргардон
   </button>
   <button id="reset" class="btn light">
    🔄 Аз нав
   </button>
  </div>

  <div class="actions">
   <button id="check" class="btn primary">
    Санҷидан ✓
   </button>
   <button id="next" class="btn green hidden">
    Давом додан →
   </button>
  </div>
 </section>

 <section id="result" class="card hidden">
  <h2>🏆 Машқ анҷом ёфт!</h2>
  <div class="question">
   <strong id="finalScore"></strong>
   <p id="finalMessage"></p>
  </div>
  <button id="again" class="btn primary"
   style="width:100%">
   🔄 Боз машқ кардан
  </button>
 </section>

</main>

let questions=[];
let index=0;
let score=0;
let chosen=[];
let shuffled=[];
let answered=false;

function loadState(){
 try{
  const data=JSON.parse(localStorage.getItem(KEY));
  return data&&typeof data==="object"?data:{};
 }catch(e){return {}}
}

let state=loadState();

function renderXP(){
 const latest=loadState();
 $("xp").textContent=Number(latest.xp)||0;
}

function shuffle(array){
 const result=[...array];
 for(let i=result.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [result[i],result[j]]=[result[j],result[i]];
 }
 return result;
}

function normalize(s){
 return String(s)
  .normalize("NFKC")
  .trim()
  .replace(/\s+/g," ")
  .toLocaleLowerCase();
}

function start(){
 const lang=$("language").value;
 const level=$("level").value;

 questions=shuffle(DATA[lang][level]);
 index=0;
 score=0;

 $("score").textContent="0";
 $("result").classList.add("hidden");
 $("exercise").classList.remove("hidden");

 showQuestion();
}

function showQuestion(){
 if(index>=questions.length){
  finish();
  return;
 }

 chosen=[];
 answered=false;

 const current=questions[index];

 // Ҳар калима ID-и алоҳида дорад.
 // Калимаҳои такрорӣ ҳам дуруст кор мекунанд.
 shuffled=shuffle(
  current[1].map((word,i)=>({word,id:i}))
 );

 $("counter").textContent=
  (index+1)+"/"+questions.length;

 $("bar").style.width=
  (index/questions.length*100)+"%";

 $("question").textContent=current[0];

 $("feedback").classList.add("hidden");
 $("check").classList.remove("hidden");
 $("next").classList.add("hidden");

 renderWords();
}

function renderWords(){
 const answer=$("answer");
 const words=$("words");

 answer.replaceChildren();
 words.replaceChildren();

 chosen.forEach((item,i)=>{
  const btn=document.createElement("button");
  btn.className="word selected";
  btn.textContent=item.word;
  btn.disabled=answered;
  btn.addEventListener("click",()=>{
   if(answered)return;
   chosen.splice(i,1);
   renderWords();
  });
  answer.appendChild(btn);
 });

 shuffled.forEach(item=>{
  const btn=document.createElement("button");
  btn.className="word";
  btn.textContent=item.word;

  const used=chosen.some(x=>x.id===item.id);
  btn.disabled=used||answered;

  btn.addEventListener("click",()=>{
   if(answered)return;
   chosen.push(item);
   renderWords();
  });

  words.appendChild(btn);
 });
}

function undo(){
 if(answered)return;
 chosen.pop();
 renderWords();
}

function reset(){
 if(answered)return;
 chosen=[];
 renderWords();
}

function check(){
 if(answered)return;

 if(chosen.length!==questions[index][1].length){
  showFeedback(
   "Аввал ҳамаи калимаҳоро интихоб кун.",
   false
  );
  return;
 }

 answered=true;

 const correct=questions[index][1].join(" ");
 const userAnswer=chosen.map(x=>x.word).join(" ");
 const success=
  normalize(correct)===normalize(userAnswer);

 if(success){
  score++;

  // XP-ро аз маълумоти охирин мехонем,
  // то пешрафти саҳифаҳои дигар гум нашавад.
  const latest=loadState();
  latest.xp=(Number(latest.xp)||0)+5;

  try{
   localStorage.setItem(KEY,JSON.stringify(latest));
  }catch(e){
   console.warn("XP сабт нашуд",e);
  }

  showFeedback("✅ Дуруст! +5 XP",true);
 }else{
  showFeedback(
   "❌ Ҷавоби дуруст: "+correct,
   false
  );
 }

 $("score").textContent=score;
 $("check").classList.add("hidden");
 $("next").classList.remove("hidden");

 renderWords();
 renderXP();
}

function showFeedback(message,success){
 const el=$("feedback");
 el.className="feedback "+(success?"correct":"wrong");
 el.textContent=message;
}

function next(){
 if(!answered)return;
 index++;
 showQuestion();
}

function finish(){
 $("exercise").classList.add("hidden");
 $("result").classList.remove("hidden");

 $("counter").textContent=
  questions.length+"/"+questions.length;

 $("finalScore").textContent=
  score+" / "+questions.length;

 $("finalMessage").textContent=
  score>=8?
  "🌟 Офарин! Натиҷаи аъло!":
  score>=5?
  "👍 Хуб! Машқро идома деҳ.":
  "📚 Боз машқ кун, натиҷа беҳтар мешавад.";
}

$("start").addEventListener("click",start);
$("check").addEventListener("click",check);
$("next").addEventListener("click",next);
$("again").addEventListener("click",start);
$("undo").addEventListener("click",undo);
$("reset").addEventListener("click",reset);

if(DATA[state.lang]){
 $("language").value=state.lang;
}

renderXP();
</script>

</html>
