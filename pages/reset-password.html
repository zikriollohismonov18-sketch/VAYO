
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VAYO — Барқарор кардани парол</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f6f8;
 color:#222;
}
header{
 background:#ff6500;
 color:white;
 text-align:center;
 padding:20px;
}
header h1{margin:0;font-size:30px}
main{
 max-width:430px;
 margin:40px auto;
 background:white;
 padding:25px;
 border-radius:16px;
 box-shadow:0 5px 20px #0001;
}
h2{text-align:center;font-size:22px}
p{line-height:1.6}
input{
 width:100%;
 padding:14px;
 margin:8px 0;
 border:1px solid #ddd;
 border-radius:9px;
 font-size:15px;
}
button{
 width:100%;
 background:#ff6500;
 color:white;
 border:0;
 border-radius:9px;
 padding:14px;
 margin-top:12px;
 font-weight:bold;
 font-size:15px;
 cursor:pointer;
}
button:disabled{opacity:.5}
a{color:#ff6500;text-decoration:none}
.message{
 display:none;
 margin-top:15px;
 padding:12px;
 border-radius:9px;
 background:#eee;
 overflow-wrap:anywhere;
}
.success{background:#e6f7eb;color:#146b35}
.error{background:#ffe9e9;color:#a32121}
.hidden{display:none}
</style>
</head>
<body>

<header>
<h1>VAYO</h1>
<p>Бозори онлайни Тоҷикистон</p>
</header>

<main>
<h2>🔐 Пароли нав</h2>

<p id="description">
Барои барқарор кардани парол,
аз пайванди ба email фиристодашуда ворид шавед.
</p>

<form id="resetForm" class="hidden">
<input
 id="password"
 type="password"
 placeholder="Пароли нав (камаш 8 аломат)"
 minlength="8"
 autocomplete="new-password"
 required
>
<input
 id="confirmPassword"
 type="password"
 placeholder="Паролро такрор кунед"
 minlength="8"
 autocomplete="new-password"
 required
>
<button type="submit" id="saveBtn">
Нигоҳ доштани пароли нав
</button>
</form>

<div id="message" class="message"></div>

<p style="text-align:center">
<a href="login.html">← Бозгашт ба воридшавӣ</a>
</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>

<script>
"use strict";

const $ = id => document.getElementById(id);
let recoveryReady = false;

function showMessage(text, success=false) {
 const el = $("message");
 el.style.display = "block";
 el.className = "message " + (success ? "success" : "error");
 el.textContent = text;
}

function enableReset() {
 recoveryReady = true;
 $("resetForm").classList.remove("hidden");
 $("description").textContent =
  "Пароли нави ҳисоби VAYO-и худро ворид кунед.";
}

async function initialize() {
 if (!window.vayoDB) {
  showMessage("Supabase танзим нашудааст.");
  return;
 }

 const params = new URLSearchParams(location.search);

 if (params.get("error")) {
  showMessage(
   params.get("error_description") ||
   "Пайванди барқарорсозӣ эътибор надорад."
  );
  return;
 }

 vayoDB.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
   enableReset();
  }
 });

 const tokenHash = params.get("token_hash");
 const type = params.get("type");

 if (tokenHash && type === "recovery") {
  const {error} = await vayoDB.auth.verifyOtp({
   token_hash: tokenHash,
   type: "recovery"
  });

  if (error) {
   showMessage(error.message);
   return;
  }

  enableReset();
  return;
 }

 const hash = new URLSearchParams(
  location.hash.replace(/^#/, "")
 );

 if (hash.get("error")) {
  showMessage(
   hash.get("error_description") ||
   "Пайванди барқарорсозӣ нодуруст аст."
  );
  return;
 }

 if (hash.get("type") === "recovery") {
  const {data,error} = await vayoDB.auth.getSession();

  if (error) {
   showMessage(error.message);
  } else if (data.session) {
   enableReset();
  }
 }
}

$("resetForm").addEventListener("submit", async e => {
 e.preventDefault();

 if (!recoveryReady) {
  showMessage("Аввал пайванди барқарорсозиро кушоед.");
  return;
 }

 const password = $("password").value;
 const confirm = $("confirmPassword").value;

 if (password.length < 8) {
  showMessage("Парол бояд камаш 8 аломат дошта бошад.");
  return;
 }

 if (password !== confirm) {
  showMessage("Паролҳо якхела нестанд.");
  return;
 }

 $("saveBtn").disabled = true;

 try {
  const {error} = await vayoDB.auth.updateUser({
   password
  });

  if (error) throw error;

  showMessage("Пароли нав бомуваффақият нигоҳ дошта шуд!", true);
  $("resetForm").classList.add("hidden");

  await vayoDB.auth.signOut();

  setTimeout(() => {
   location.href = "login.html";
  }, 1800);
 } catch (err) {
  showMessage(err.message || "Хато ҳангоми иваз кардани парол.");
 } finally {
  $("saveBtn").disabled = false;
 }
});

initialize();
</script>
</body>
</html>
