
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff6500">
<title>VAYO — Сабади харид</title>

<style>
:root{
 --orange:#ff6500;
 --red:#f23325;
 --ink:#192132;
 --muted:#6e7686;
 --line:#e9ebf0;
 --bg:#f6f7fa;
}
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:var(--bg);
 color:var(--ink);
}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
a{text-decoration:none;color:inherit}
header{
 background:linear-gradient(115deg,#ff4c13,#ff7900);
 color:white;
 padding:17px;
 box-shadow:0 5px 20px #ff650022;
}
.top{
 max-width:1100px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
}
.logo{font-size:34px;font-weight:900;letter-spacing:-2px}
.back{
 background:#ffffff25;
 border:1px solid #ffffff55;
 border-radius:25px;
 padding:11px 17px;
 font-weight:700;
}
main{
 max-width:1100px;
 margin:25px auto 70px;
 padding:0 14px;
}
h1{font-size:28px;margin:0 0 20px}
.card{
 background:white;
 padding:20px;
 border-radius:16px;
 margin-bottom:15px;
 border:1px solid #edf0f3;
 box-shadow:0 5px 20px #101d3810;
}
.item{
 display:flex;
 gap:17px;
 align-items:flex-start;
}
.photo{
 flex:0 0 105px;
 width:105px;
 height:115px;
 object-fit:cover;
 border-radius:11px;
 background:#eee;
 border:1px solid var(--line);
}
.photo.empty{
 display:grid;
 place-items:center;
 font-size:30px;
}
.info{flex:1;min-width:0}
.name{font-weight:800;font-size:16px;line-height:1.5}
.muted{font-size:13px;color:var(--muted);line-height:1.6}
.price{font-weight:900;color:var(--red);font-size:20px;margin-top:8px}
.old-price{
 color:#999;
 font-size:13px;
 text-decoration:line-through;
 margin-left:8px;
}
.discount{
 display:inline-block;
 background:#ffe5e2;
 color:#df2922;
 font-size:12px;
 font-weight:800;
 padding:4px 7px;
 border-radius:6px;
 margin-left:8px;
}
.controls{
 display:flex;
 align-items:center;
 gap:9px;
 flex-wrap:wrap;
 margin-top:13px;
}
.controls button{
 background:var(--orange);
 color:white;
 border:0;
 border-radius:9px;
 padding:9px 14px;
 font-weight:800;
}
.controls .remove{background:#4c5667}
.quantity{min-width:22px;text-align:center}
.item-total{margin-top:12px;font-weight:800;font-size:14px}
.summary{max-width:440px;margin-left:auto}
.line{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 padding:13px 0;
 border-bottom:1px solid var(--line);
 font-size:14px;
}
.total{font-size:23px;font-weight:900;color:var(--red)}
.checkout{
 display:block;
 text-align:center;
 background:linear-gradient(100deg,#ff4700,#ff8500);
 color:white;
 padding:16px;
 border-radius:11px;
 margin-top:18px;
 font-weight:900;
 box-shadow:0 7px 18px #ff650033;
}
.empty-cart{text-align:center;padding:40px 20px}
.empty-cart .emoji{font-size:52px;margin-bottom:12px}
.shop-link{
 display:inline-block;
 margin-top:12px;
 padding:12px 18px;
 border-radius:10px;
 background:var(--orange);
 color:white;
 font-weight:800;
}
.warning{
 background:#fff2dd;
 color:#8a4a00;
 padding:14px;
 border-radius:10px;
 margin-bottom:15px;
 white-space:pre-line;
}
.loading{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:520px){
 .item{gap:11px}
 .photo{flex-basis:78px;width:78px;height:90px}
 .card{padding:14px}
 .logo{font-size:29px}
 .name{font-size:14px}
 .price{font-size:18px}
 .back{font-size:13px}
}
</style>
</head>

<body>

<header>
 <div class="top">
  <a class="logo" href="../index.html">VAYO</a>
  <a class="back" href="../index.html">← Асосӣ</a>
 </div>
</header>

<main>
 <h1>🛒 Сабади харид</h1>

 <div id="notice" class="warning" hidden></div>

 <div id="items">
  <div class="card loading">Маҳсулот боргирӣ мешаванд...</div>
 </div>

 <div id="summary" class="card summary" hidden>
  <h2>💰 Ҳисоби фармоиш</h2>

  <div class="line">
   <span>Миқдори маҳсулот</span>
   <strong id="count">0</strong>
  </div>

  <div class="line">
   <span>Ҷамъи молҳо</span>
   <strong id="subtotal">0 сомонӣ</strong>
  </div>

  <div class="line">
   <span>Расонидан</span>
   <span class="muted">Дар checkout ҳисоб мешавад</span>
  </div>

  <div class="line">
   <strong>Маблағи молҳо</strong>
   <strong class="total" id="total">0 сомонӣ</strong>
  </div>

  <a class="checkout" href="checkout.html">
   📦 Давом додани фармоиш
  </a>

  <p class="muted">
   Нарх, тахфиф ва захираи маҳсулот ҳангоми
   сабти фармоиш дар сервер аз нав санҷида мешаванд.
  </p>
 </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

const SB_URL="https://rgminzzmlktkliliiupt.supabase.co";
const SB_KEY="sb_publishable_UHJzsYIpimmjtDtHEnacQA_BJVKE2pD";
const CART_KEY="vayo_cart_v1";
const $=id=>document.getElementById(id);

let db=null;
let cart=[];

try{
 db=window.vayoDB ||
  (window.supabase &&
   window.supabase.createClient(SB_URL,SB_KEY));
 if(db)window.vayoDB=db;
}catch(error){
 console.error("Supabase:",error);
}

function money(value){
 return (Number(value)||0).toFixed(2)+" сомонӣ";
}

function warn(text){
 $("notice").textContent=text;
 $("notice").hidden=!text;
}

function readCart(){
 try{
  const data=JSON.parse(localStorage.getItem(CART_KEY)||"[]");
  return Array.isArray(data)?data:[];
 }catch{
  return [];
 }
}

function saveCart(){
 const minimal=cart.map(item=>({
  product_id:item.product_id,
  quantity:item.quantity
 }));
 localStorage.setItem(CART_KEY,JSON.stringify(minimal));
}

function create(tag,className,text){
 const element=document.createElement(tag);
 if(className)element.className=className;
 if(text!==undefined)element.textContent=String(text);
 return element;
}

function normalizeCart(raw){
 const grouped=new Map();

 for(const entry of raw){
  const id=String(entry?.product_id||"");
  const quantity=Number(entry?.quantity);

  if(
   !/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(id) ||
   !Number.isInteger(quantity) ||
   quantity<=0
  )continue;

  grouped.set(
   id,
   Math.min(100,(grouped.get(id)||0)+quantity)
  );
 }

 return [...grouped].map(([product_id,quantity])=>({
  product_id,quantity
 }));
}

function validPhoto(value){
 if(typeof value!=="string"||!value.trim())return null;
 try{
  const url=new URL(value,location.href);
  return ["https:","http:"].includes(url.protocol)?url.href:null;
 }catch{
  return null;
 }
}

function activePrice(product){
 const regular=Number(product.regular_price??product.price);
 const sale=Number(product.price);
 const now=Date.now();

 const starts=product.sale_starts_at
  ?new Date(product.sale_starts_at).getTime():NaN;
 const ends=product.sale_ends_at
  ?new Date(product.sale_ends_at).getTime():NaN;

 const saleActive=
  Number.isFinite(starts)&&
  Number.isFinite(ends)&&
  starts<=now&&
  ends>now&&
  sale<regular;

 return {
  price:saleActive?sale:regular,
  regular
 };
}

async function refreshCart(){
 warn("");

 if(!db){
  warn("Supabase пайваст нашуд.");
  $("items").textContent="Боргирӣ имконнопазир аст.";
  return;
 }

 const raw=normalizeCart(readCart());
 const ids=raw.map(x=>x.product_id);

 if(!ids.length){
  cart=[];
  render();
  return;
 }

 try{
  const {data,error}=await db
   .from("vayo_products")
   .select(`
    id,
    name,
    price,
    regular_price,
    stock,
    active,
    sale_starts_at,
    sale_ends_at,
    image_url,
    shop_id,
    vayo_shops!inner(
     id,
     name,
     status
    )
   `)
   .in("id",ids)
   .eq("active",true)
   .eq("vayo_shops.status","approved");

  if(error)throw error;

  const byId=new Map(
   (data||[]).map(p=>[String(p.id),p])
  );

  let changed=false;
  cart=[];

  for(const entry of raw){
   const p=byId.get(entry.product_id);

   if(!p||!p.vayo_shops||Number(p.stock)<=0){
    changed=true;
    continue;
   }

   const quantity=Math.min(
    entry.quantity,
    Math.floor(Number(p.stock)),
    100
   );

   if(quantity<=0){
    changed=true;
    continue;
   }

   if(quantity!==entry.quantity)changed=true;

   const pricing=activePrice(p);

   if(!Number.isFinite(pricing.price)||pricing.price<0){
    changed=true;
    continue;
   }

   cart.push({
    product_id:String(p.id),
    name:p.name,
    shop_name:p.vayo_shops.name,
    shop_id:p.shop_id,
    quantity,
    max_stock:Math.floor(Number(p.stock)),
    price:pricing.price,
    regular:pricing.regular,
    image:p.image_url||""
   });
  }

  if(cart.length!==raw.length)changed=true;

  if(changed){
   warn("Баъзе маҳсулот ё миқдори онҳо аз рӯйи маълумоти сервер нав карда шуданд.");
  }

  saveCart();
  render();

 }catch(error){
  warn("Хатои боргирии маҳсулот: "+(error.message||String(error)));
  $("items").textContent="Маҳсулот боргирӣ нашуданд.";
 }
}

function updateQuantity(id,delta){
 const item=cart.find(x=>x.product_id===id);
 if(!item)return;

 item.quantity=Math.min(
  item.max_stock,
  100,
  Math.max(1,item.quantity+delta)
 );

 saveCart();
 render();
}

function removeItem(id){
 cart=cart.filter(x=>x.product_id!==id);
 saveCart();
 render();
}

function render(){
 const root=$("items");
 root.replaceChildren();

 if(!cart.length){
  const empty=create("div","card empty-cart");
  empty.append(
   create("div","emoji","🛒"),
   create("h2","","Сабади шумо холӣ аст."),
   create("p","muted","Барои фармоиш аввал маҳсулот интихоб кунед.")
  );

  const link=create("a","shop-link","🛍️ Ба бозор рафтан");
  link.href="../index.html";
  empty.append(link);
  root.append(empty);

  $("summary").hidden=true;
  return;
 }

 let subtotal=0;
 let count=0;

 for(const item of cart){
  const card=create("div","card item");
  const imageUrl=validPhoto(item.image);
  let photo;

  if(imageUrl){
   photo=create("img","photo");
   photo.src=imageUrl;
   photo.alt=item.name;
   photo.loading="lazy";
  }else{
   photo=create("div","photo empty","📦");
  }

  const info=create("div","info");
  info.append(
   create("div","name",item.name),
   create("p","muted","🏪 "+item.shop_name)
  );

  const price=create("div","price",money(item.price));

  if(item.regular>item.price){
   price.append(
    create("span","old-price",money(item.regular))
   );

   const percent=Math.round(
    (1-item.price/item.regular)*100
   );

   if(percent>0){
    price.append(
     create("span","discount","−"+percent+"%")
    );
   }
  }

  info.append(price);

  const controls=create("div","controls");

  const minus=create("button","","−");
  minus.type="button";
  minus.disabled=item.quantity<=1;
  minus.onclick=()=>updateQuantity(item.product_id,-1);

  const qty=create("strong","quantity",item.quantity);

  const plus=create("button","","+");
  plus.type="button";
  plus.disabled=item.quantity>=item.max_stock||item.quantity>=100;
  plus.onclick=()=>updateQuantity(item.product_id,1);

  const remove=create("button","remove","Нест кардан");
  remove.type="button";
  remove.onclick=()=>removeItem(item.product_id);

  controls.append(minus,qty,plus,remove);
  info.append(controls);

  info.append(
   create("div","item-total",
    "Ҳамагӣ: "+money(item.price*item.quantity))
  );

  card.append(photo,info);
  root.append(card);

  subtotal+=item.price*item.quantity;
  count+=item.quantity;
 }

 $("count").textContent=count;
 $("subtotal").textContent=money(subtotal);
 $("total").textContent=money(subtotal);
 $("summary").hidden=false;
}

refreshCart();
</script>
</body>
</html>
